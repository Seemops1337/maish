<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maish</title>
  <style>
    /* Monochrome Geist palette (src/styles/globals.css). The splash opens before
       the app reads its theme setting, so it follows the system appearance,
       as the macOS 26 app icon does. */
    :root {
      --bg: #ffffff;
      --fg: #171717;
      --tile: #fafafa;
      --tile-border: rgba(0, 0, 0, 0.08);
      --glyph: #171717;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --fg: #ededed;
        --tile: #0a0a0a;
        --tile-border: rgba(255, 255, 255, 0.12);
        --glyph: #ededed;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    .logo {
      width: 180px;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.1s forwards;
    }

    .logo .tile { fill: var(--tile); }
    .logo .tile-border { stroke: var(--tile-border); }
    .logo .glyph { stroke: var(--glyph); }
    .logo .wordmark { fill: var(--fg); }

    .loader {
      display: flex;
      gap: 6px;
      margin-top: 32px;
      opacity: 0;
      animation: fadeIn 0.6s ease-out 0.4s forwards;
    }

    .loader span {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--fg);
      animation: pulse 1.4s ease-in-out infinite;
    }

    .loader span:nth-child(2) { animation-delay: 0.2s; }
    .loader span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 80%, 100% { opacity: 0.3; transform: scale(0.8); }
      40%           { opacity: 1;   transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <!-- Maish logo — inline SVG, no external dependencies -->
  <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 120" fill="none" role="img" aria-label="Maish">
    <!-- Same geometry as src-tauri/icons/icon.svg, scaled from 1024 to 100 -->
    <g transform="translate(4 10) scale(0.09765625)">
      <rect class="tile" width="1024" height="1024" rx="180"/>
      <rect class="tile-border" x="4" y="4" width="1016" height="1016" rx="176" stroke-width="8"/>
      <path class="glyph" d="M248,742 V307 L512,543 L776,307 V742 Z" stroke-width="80" stroke-linejoin="round"/>
    </g>
    <text class="wordmark" x="128" y="82" font-family="system-ui, -apple-system, Segoe UI, sans-serif"
          font-size="62" font-weight="600" letter-spacing="2">Maish</text>
  </svg>

  <div class="loader">
    <span></span>
    <span></span>
    <span></span>
  </div>
</body>
</html>
